<!DOCTYPE html>
<html ng-app='ShoppingListCheckOff'>
  <head>
    <meta charset="utf-8">
    <script src="js/angular.min.js"></script>
    <script src="js/app.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <title>Shopping List Check On</title>
  </head>
  <body>
    <h1>Shopping List Check On</h1>

    <!-- LIST #1 - unlimited items -->
    <div id="list1" ng-controller='ToBuyController as list1'>
      <h3>To Buy Shopping List</h3>
      <ol>
        <li ng-repeat="item in list1.toBuyItems">
          Buy {{ item.quantity }} of {{ item.name }}
          <button ng-click="list1.removeItem($index);">Bought</button>
        </li>
      </ol>
      <div class="error" ng-if="list1.toBuyItems.length == 0">Everything is bought!</div>
    </div>
    <!-- LIST #2  -->
    <div id="list2" ng-controller='AlreadyBoughtController as list2'>
      <h3>Already Bought Shopping List</h3>
      <ol>
        <li ng-repeat="item in list2.boughtItems">
          Bought {{ item.quantity }} of {{ item.name }}
        </li>
      </ol>
      <div class="error" ng-if="list2.boughtItems.length == 0">Nothing bought yet.</div>
    </div>
  </body>
</html>
